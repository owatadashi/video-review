<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LM27RL65BG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LM27RL65BG');
  </script>
  <title>まとめページ - Clippin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Clippin">
  <meta property="og:title" content="まとめページ - Clippin">
  <meta property="og:description" content="複数の動画をまとめて確認できるページです。動画を選んで、タイムコード付きでコメントを残せます。">
  <meta property="og:image" content="https://clippin.work/og-image.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3efe6; --paper-2: #ebe5d8; --card: #fbf9f4;
      --ink: #1d1c1a; --ink-2: #57534b; --ink-3: #8f897d; --line: #d9d2c3;
      --fusen: #ffd94a; --fusen-soft: #fff1b3; --fusen-edge: #c9a51f; --shu: #d9442b;
      --jp: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --latin: 'Inter Tight', var(--jp);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--ink); font-family: var(--jp); font-feature-settings: "palt"; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; flex-direction: column; }
    button { font-family: inherit; }
    ::selection { background: var(--fusen); }

    header { height: 60px; padding: 0 28px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); }
    .logo { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
    .logo-mark { position: relative; width: 18px; height: 20px; }
    .logo-mark::before { content: ""; position: absolute; inset: 0; background: var(--fusen); clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); }
    .logo-mark::after { content: ""; position: absolute; right: 0; bottom: 0; width: 28%; height: 28%; background: var(--fusen-edge); clip-path: polygon(0 0, 100% 0, 0 100%); }
    .logo-word { font-family: var(--latin); font-weight: 700; font-size: 19px; letter-spacing: -0.04em; }
    .header-nav { display: flex; gap: 20px; align-items: center; margin-left: auto; }
    .header-nav a { font-size: 13px; color: var(--ink-2); text-decoration: none; }
    .header-nav a:hover { color: var(--ink); }

    main { flex: 1; max-width: 880px; width: 100%; margin: 0 auto; padding: 56px 28px 88px; }
    .eyebrow { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
    .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-width: 0; }
    h1 { font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: .02em; line-height: 1.4; overflow-wrap: anywhere; }
    .title-input { font: inherit; font-size: 28px; font-weight: 700; border: 1px solid var(--ink); box-shadow: 0 0 0 3px rgba(255,217,74,.35); border-radius: 4px; background: #fff; padding: 2px 10px; width: 100%; max-width: 600px; outline: none; color: var(--ink); }
    .icon-btn { background: none; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-2); padding: 4px 10px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
    .meta { font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 20px; margin-bottom: 32px; }
    .meta span:first-child { font-family: var(--mono); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .btn { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .02em; padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); text-decoration: none; }
    .btn:hover { background: var(--paper-2); }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-primary:hover { background: #000; }

    .list { list-style: none; border-top: 1px solid var(--ink); }
    .row { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 16px; padding: 16px 4px; border-bottom: 1px solid var(--line); }
    .row:hover { background: var(--card); }
    .num { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
    .name { min-width: 0; }
    .name a { color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .name a:hover { text-decoration: underline; text-decoration-color: var(--fusen); text-decoration-thickness: 3px; text-underline-offset: 3px; }
    .name .url { font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .badges { display: flex; gap: 8px; align-items: center; }
    .badge { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .badge.ver { font-family: var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
    .badge.open { color: var(--shu); }
    .badge.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--shu); }
    .badge.done { color: var(--ink-2); }
    .badge.done::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
    .empty, .error { padding: 48px 16px; text-align: center; color: var(--ink-3); font-size: 14px; line-height: 1.9; border-bottom: 1px solid var(--line); }
    .error { color: var(--shu); }
    .note { font-size: 12px; color: var(--ink-3); margin-top: 18px; line-height: 1.8; padding-left: 12px; border-left: 3px solid var(--fusen); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 4px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 50; max-width: calc(100vw - 32px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; padding: 18px 28px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line); }
    .footer-links { display: flex; flex-wrap: wrap; gap: 6px 20px; }
    footer a { color: var(--ink-2); text-decoration: none; }
    footer a:hover { color: var(--ink); text-decoration: underline; }

    @media (max-width: 600px) {
      header { height: 52px; padding: 0 16px; }
      main { padding: 32px 16px 64px; }
      h1, .title-input { font-size: 22px; }
      .row { grid-template-columns: 24px 1fr auto; gap: 6px 12px; padding: 14px 2px; }
      .badges { grid-column: 2 / -1; grid-row: 2; }
      .header-nav a:not(:last-child) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="/" aria-label="Clippin トップへ"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">clippin</span></a>
  <nav class="header-nav">
    <a href="/usage">使い方</a>
    <a href="/">新しくアップロード</a>
  </nav>
</header>

<main>
  <div class="eyebrow">まとめページ</div>
  <div class="title-row" id="titleRow">
    <h1 id="batchName">読み込み中...</h1>
    <button class="icon-btn" id="renameBtn" onclick="startRename()" title="名前を変更" style="display:none">名前を変更</button>
  </div>
  <div class="meta" id="meta"></div>

  <div class="actions" id="actions" style="display:none">
    <button class="btn btn-primary" onclick="copyAllLinks()">動画リンクをすべてコピー</button>
    <button class="btn" onclick="copyPageLink()">このページのリンクをコピー</button>
  </div>

  <ul class="list" id="list"></ul>
  <p class="note" id="note" style="display:none">
    「動画リンクをすべてコピー」は上から順に改行区切りでコピーします。スプレッドシートのセルを選んで貼り付けると、1行に1本ずつ入ります。<br>
    このページのリンクを送れば、相手はここから全部の動画を確認できます。
  </p>
</main>

<footer>
  <nav class="footer-links"><a href="/usage">使い方</a><a href="/faq">よくある質問</a><a href="/privacy">プライバシーポリシー</a></nav>
  <span>&copy; 株式会社Webil</span>
</footer>

<div class="toast" id="toast"></div>

<script>
  const RETENTION_DAYS = 30;
  const batchId = location.pathname.split('/').filter(Boolean)[1] || '';
  let batch = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtDate(d) {
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function writeClipboard(text) {
    navigator.clipboard.writeText(text).catch(() => {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      el.remove();
    });
  }
  const projectUrl = id => `${location.origin}/project/${id}`;

  async function load() {
    const list = document.getElementById('list');
    try {
      const res = await fetch(`/api/batches/${encodeURIComponent(batchId)}`);
      if (!res.ok) throw new Error(res.status === 404 ? 'notfound' : `HTTP ${res.status}`);
      batch = await res.json();
    } catch (e) {
      document.getElementById('batchName').textContent = 'まとめページが見つかりません';
      list.innerHTML = `<li class="error">${e.message === 'notfound'
        ? 'リンクが間違っているか、削除された可能性があります。'
        : '読み込みに失敗しました。時間をおいて再読み込みしてください。'}</li>`;
      return;
    }
    render();
  }

  function render() {
    document.title = `${batch.name} - Clippin`;
    document.getElementById('batchName').textContent = batch.name;
    document.getElementById('renameBtn').style.display = '';

    const created = new Date(batch.createdAt);
    const expiry  = new Date(created.getTime() + RETENTION_DAYS * 24 * 60 * 60 * 1000);
    const expired = Date.now() > expiry.getTime();
    document.getElementById('meta').innerHTML = [
      `${batch.projects.length}本の動画`,
      `作成日：${fmtDate(created)}`,
      expired
        ? `<span style="color:var(--danger)">閲覧期限切れ（${fmtDate(expiry)}）— 動画は削除されています</span>`
        : `閲覧期限：${fmtDate(expiry)}まで`,
    ].map(s => `<span>${s}</span>`).join('');

    const list = document.getElementById('list');
    if (!batch.projects.length) {
      list.innerHTML = '<li class="empty">まだ動画がありません。<br>アップロードが完了すると、ここに追加されます。</li>';
      return;
    }
    document.getElementById('actions').style.display = '';
    document.getElementById('note').style.display = '';
    list.innerHTML = batch.projects.map((p, i) => {
      const url = projectUrl(p.id);
      const status = !p.pinCount
        ? '<span class="badge">付箋なし</span>'
        : p.openCount
          ? `<span class="badge open">未解決 ${p.openCount}</span>`
          : '<span class="badge done">すべて解決済</span>';
      return `
        <li class="row">
          <span class="num">${i + 1}</span>
          <div class="name">
            <a href="${esc(url)}">${esc(p.name)}</a>
            <div class="url">${esc(url)}</div>
          </div>
          <div class="badges">
            ${p.versionNum > 1 ? `<span class="badge ver">v${p.versionNum}</span>` : ''}
            ${status}
          </div>
          <button class="icon-btn" onclick="copyOne('${esc(p.id)}')">コピー</button>
        </li>`;
    }).join('');
  }

  function copyOne(id) {
    writeClipboard(projectUrl(id));
    toast('リンクをコピーしました');
  }
  function copyAllLinks() {
    writeClipboard(batch.projects.map(p => projectUrl(p.id)).join('\n'));
    toast(`${batch.projects.length}本のリンクをコピーしました`);
  }
  function copyPageLink() {
    writeClipboard(location.origin + location.pathname);
    toast('このページのリンクをコピーしました');
  }

  function startRename() {
    const row = document.getElementById('titleRow');
    row.innerHTML = `<input class="title-input" id="titleInput" maxlength="100" value="${esc(batch.name)}">`;
    const input = document.getElementById('titleInput');
    input.focus();
    input.select();
    let done = false;
    const finish = async save => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      if (save && name && name !== batch.name) {
        const res = await fetch(`/api/batches/${encodeURIComponent(batchId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        }).catch(() => null);
        if (res?.ok) { batch.name = name; toast('名前を変更しました'); }
        else toast('名前の変更に失敗しました');
      }
      row.innerHTML = `<h1 id="batchName"></h1><button class="icon-btn" id="renameBtn" onclick="startRename()" title="名前を変更">名前を変更</button>`;
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.isComposing) return;
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  load();
</script>
</body>
</html>
